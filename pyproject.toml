[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-compliance-automation"
version = "0.1.0"
description = "AI Semantic Guardrails EU — GitHub-native compliance harness. Core component: Semantic Guard (emits labels; OPA decides). Project: ai-semantic-guardrails-eu."
requires-python = ">=3.11"
# The oss profile runs on the Python standard library alone, so CI (and an
# offline sandbox) can pass with no third-party install step. Optional
# extras below are used only when available and are never required by oss.
dependencies = []

[project.optional-dependencies]
# Real local embedding model (small, CPU-only). When absent, the Guard falls
# back to a deterministic hashed-vector embedder so CI stays reproducible.
# Pinned so a real-backend eval run is reproducible. Model:
# sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 (CPU, DE+EN).
embeddings = [
    "sentence-transformers==3.0.1",
    "numpy>=1.24,<2",
]
# Hybrid-profile and richer-tooling extras (not needed for oss CI).
hybrid = [
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
    # PyYAML so tests/test_yamlio.py exercises the PyYAML path instead of skipping.
    "PyYAML>=6",
]

[project.scripts]
# Thin adapter that connects an AI coding tool's hook to POST /v1/check.
guardrails-hook = "guardrails_hook.cli:main"
# CI gate: scans a PR diff and runs the same decision engine in-process.
guardrails-ci = "guardrails_ci.cli:main"
# Deploy gate: checks obligations + two-person approvals before production.
guardrails-deploy-gate = "guardrails_ci.deploy_gate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
