[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-compliance-automation"
version = "0.1.0"
description = "AI Compliance Automation — GitHub-native compliance harness. Core component: Semantic Guard (emits labels; OPA decides)."
requires-python = ">=3.11"
# The oss profile runs on the Python standard library alone, so CI (and an
# offline sandbox) can pass with no third-party install step. Optional
# extras below are used only when available and are never required by oss.
dependencies = []

[project.optional-dependencies]
# Real local embedding model (small, CPU-only). When absent, the Guard falls
# back to a deterministic hashed-vector embedder so CI stays reproducible.
embeddings = [
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]
# Hybrid-profile and richer-tooling extras (not needed for oss CI).
hybrid = [
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
