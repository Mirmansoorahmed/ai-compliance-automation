apiVersion: constraints.gatekeeper.sh/v1beta1
kind: EuAiComplianceDeployGate
metadata:
  name: eu-ai-compliance-deploy-gate
  annotations:
    description: >-
      Apply the EU AI compliance deploy gate to Deployments that declare a
      high-risk use case via the "guardrails.eu/use-case" annotation.
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
  parameters:
    requiredApprovers: 2
